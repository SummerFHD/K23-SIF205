<!doctype html>
<html lang="en">
<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.3.2/jquery-confirm.min.css">
  <title>CRUD | Nodejs - MySql </title>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="card-header" style="background: #343a40;color: white;align-content: center;">
        CRUD Barang | Nodejs - MySql
      </div>

      <button type="button" class="btn btn-primary btnTambahData mt-1" data-toggle="modal" data-target="#exampleModal">
        Tambah Barang
      </button>
      <hr>
      <table class="table">
        <thead class="thead-dark">
          <tr>
            <th scope="col">#</th>
            <th scope="col">Kode Barang</th>
            <th scope="col">Nama Barang</th>
            <th scope="col">Qty</th>
            <th scope="col">Harga</th>
            <th scope="col">Membuat</th>
            <th scope="col">Ganti</th>
            <th scope="col">Aksi</th>
          </tr>
        </thead>
        <tbody id="databody">
          <!-- Data akan ditambahkan di sini melalui JavaScript -->
        </tbody>
      </table>

    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Tambah Barang</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="card-body">
            <div class="form-group">
              <label for="kdBarang">Kode Barang</label>
              <input type="text" class="form-control" id="kdBarang" placeholder="Masukkan Kode Barang" autocomplete="off">
            </div>
            <div class="form-group">
              <label for="namaBarang">Nama Barang</label>
              <input type="text" class="form-control" id="namaBarang" placeholder="Masukkan Nama Barang" autocomplete="off">
            </div>
            <div class="form-group">
              <label for="qty">Qty</label>
              <input type="number" class="form-control" id="qty" placeholder="Masukkan Qty" autocomplete="off">
            </div>
            <div class="form-group">
              <label for="price">Harga</label>
              <input type="number" class="form-control" id="price" placeholder="Masukkan Harga" autocomplete="off">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" id="btn_save">Simpan</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Optional JavaScript -->
  <!-- jQuery first, then Popper.js, then Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.3.2/jquery-confirm.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
